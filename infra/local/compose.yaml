name: runsheet

services:
  postgres:
    image: postgres:16-alpine
    container_name: runsheet-postgres
    environment:
      POSTGRES_USER: runsheet
      POSTGRES_PASSWORD: runsheet
      POSTGRES_DB: runsheet
    ports:
      - "15432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runsheet"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: runsheet-redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    container_name: runsheet-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 768M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"
      - "19644:9644"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 30

  console:
    image: redpandadata/console:v2.8.2
    container_name: runsheet-console
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "18080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: runsheet-clickhouse
    environment:
      CLICKHOUSE_USER: runsheet
      CLICKHOUSE_PASSWORD: runsheet
      CLICKHOUSE_DB: runsheet
    ports:
      - "18123:8123"
      - "19000:9000"
    volumes:
      - clickhouse:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user runsheet --password runsheet -q 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres:
  redpanda:
  clickhouse:
