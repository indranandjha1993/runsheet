name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit carries a sign-off
        run: |
          missing=$(git log --format='%H %s%n%b%n---' \
            "origin/${{ github.base_ref }}..HEAD" |
            awk 'BEGIN{RS="---\n"} $0 !~ /Signed-off-by: .+ <.+@.+>/ && NF {print substr($0,1,60)}')
          if [ -n "$missing" ]; then
            echo "These commits have no sign-off. See CONTRIBUTING.md."
            echo "$missing"
            echo "Fix them with: git rebase --signoff origin/${{ github.base_ref }}"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runsheet
          POSTGRES_PASSWORD: runsheet
          POSTGRES_DB: runsheet
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U runsheet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Create the databases each test suite owns
        run: |
          # Read from the same file the local stack uses, so a new service cannot be added in
          # one place and forgotten in the other.
          databases=$(grep -oE 'CREATE DATABASE test_[a-z_]+' infra/local/postgres/init/001-databases.sql |
            awk '{print $3}')
          if [ -z "$databases" ]; then
            echo "No test databases found in the init script."
            exit 1
          fi
          for db in $databases; do
            PGPASSWORD=runsheet createdb -h localhost -p 15432 -U runsheet "$db"
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec vitest run --coverage
